databases:
  - name: hostel-db
    plan: free
    databaseName: hostel_db
    user: hostel_user

services:
  - type: web
    name: hostel-management
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt psycopg2-binary
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: hostel-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
