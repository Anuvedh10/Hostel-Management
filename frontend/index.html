<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hostel Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ LOGIN VIEW ============ -->
<section id="view-login" class="view view-login">
  <div class="login-card">
    <div class="login-mark">
      <span class="mark-key">⌘</span>
      <span class="mark-word">Keyring</span>
    </div>
    <p class="login-tag">The hostel's front desk, digitized.</p>

    <form id="login-form" class="login-form">
      <label>Username
        <input type="text" id="login-username" autocomplete="username" required>
      </label>
      <label>Password
        <input type="password" id="login-password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>

    <p class="login-error" id="login-error"></p>

  </div>
</section>

<!-- ============ APP SHELL ============ -->
<div id="app-shell" class="app-shell hidden">
  <aside class="sidebar">
    <div class="sidebar-mark">
      <span class="mark-key">⌘</span>
      <span class="mark-word">Keyring</span>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-foot">
      <div class="who">
        <div class="who-name" id="who-name">—</div>
        <div class="who-role" id="who-role">—</div>
      </div>
      <button class="btn btn-ghost btn-block" id="logout-btn">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="page-title">Dashboard</h1>
      <span class="topbar-clock" id="topbar-clock"></span>
    </header>
    <div class="main-content" id="main-content"></div>
  </main>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
